name: Rodovar - Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests without private runtime data
        run: node --import tsx --test scripts/home-premium.test.ts scripts/activity-order.test.ts scripts/notification-navigation.test.ts scripts/global-loading.test.ts scripts/expedition-client.test.ts scripts/freight-upload-client.test.ts
      - run: npm run build
