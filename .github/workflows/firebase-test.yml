name: Firebase isolated integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: node --no-experimental-require-module -e "require('firebase-admin/auth')"
      - run: npm run firebase:test
      - run: npm run cloud:test
